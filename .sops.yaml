# for Bitwarden SSH-agent-backed developer keys.
# Add the brother's age1 recipient later, then run:
# sops updatekeys secrets/shared.env.enc.yaml
# Do not commit age private keys. age-plugin-sshagent identity files contain no
# secret material, but keep them local so each machine can select its own agent key.

