# SOPS/age config for shared local development secrets.
#
# Replace the placeholder recipients below with the age public recipients for
# JB and his brother before creating or re-keying secrets/shared.env.enc.yaml.
# Do not commit age private keys.

creation_rules:
  - path_regex: ^secrets/.*\.env\.enc\.yaml$
    age: >-
      age1REPLACE_WITH_JB_PUBLIC_RECIPIENT,
      age1REPLACE_WITH_BROTHER_PUBLIC_RECIPIENT
