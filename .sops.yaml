# Current recipient set contains JB's SSH public key only.
# Add the brother's age or SSH public recipient later, then run:
# sops updatekeys secrets/shared.env.enc.yaml
# Do not commit age private keys.
# Note: SOPS age SSH-key decrypt does not use ssh-agent. Configure
# SOPS_AGE_SSH_PRIVATE_KEY_FILE or SOPS_AGE_SSH_PRIVATE_KEY_CMD for SSH identities.

creation_rules:
